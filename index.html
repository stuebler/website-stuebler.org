<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webseite in Planung</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            text-align: center;
        }

        .container {
            max-width: 650px;
            padding: 40px 25px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 18px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #6b7280;
        }

        .notice {
            margin-top: 30px;
            padding: 15px 20px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            font-size: 15px;
            color: #4b5563;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .icon {
                font-size: 65px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="icon">🚧</div>

        <h1>Webseite in Planung</h1>

        <p>
            Diese Webseite befindet sich derzeit noch im Aufbau
            und ist momentan nicht aufrufbar.
        </p>

        <div class="notice">
            Bitte schauen Sie später wieder vorbei.
        </div>
    </main>

</body>
</html>
